name: Build APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/parcela-a-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=parcela-a-release.jks
          EOF

      - name: Build release APK (arm64-v8a)
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-number=$VERSION_CODE \
            --build-name="${GITHUB_REF_NAME#v}" \
            --no-tree-shake-icons

      - name: Definir nome do APK
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APK_NAME="parcela-a-${GITHUB_REF_NAME}.apk"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            APK_NAME="parcela-a-dev.apk"
            RELEASE_TAG="latest"
          fi
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}" >> "$GITHUB_ENV"

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: Parcela A (${{ github.ref_type == 'tag' && github.ref_name || 'latest' }})
          body: |
            Build automático a partir do commit `${{ github.sha }}`.
            APK Flutter **arm64-v8a** (release).
            [**Baixar APK**](${{ env.APK_URL }})
          files: ${{ env.APK_NAME }}
          overwrite: true
          make_latest: true

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/parcela-a-release.jks android/key.properties
